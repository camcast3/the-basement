# Tailscale ingress proxy — Loki push API
# Exposes Loki's HTTP API onto the tailnet so VM-side promtail
# (Proxmox C2E2 + Azure lobby) can ship logs without K8s DNS resolution
# or public port exposure.
#
# Namespace = monitoring (same as the loki SingleBinary pod) so the
# selector below can resolve to real endpoints. The earlier attempt
# used a manually-managed EndpointSlice in the tailscale namespace,
# but ArgoCD's default resource.exclusions list drops
# discovery.k8s.io/EndpointSlice, so the slice never landed and the
# proxy black-holed traffic at the kube-proxy layer.
#
# Same-namespace selector → kube-proxy auto-generates the EndpointSlice
# from the matching pod(s) (no manual slice needed, no ArgoCD exclusion
# issue, no cross-namespace hop required).
#
# NOTE: the selector below is coupled to the loki Helm chart's
# SingleBinary labels. If loki is upgraded to SimpleScalable /
# Distributed mode (or the chart's selectorLabels change), update
# the selector or this Service will silently lose its endpoints.
# Verify after any loki upgrade with:
#   kubectl get endpointslice -n monitoring \
#     -l kubernetes.io/service-name=ts-loki-ingress -o wide
#
# Backend: the SingleBinary Loki pod direct, NOT the loki-gateway nginx
# sidecar. The bundled nginx adds no value with auth_enabled: false
# + single-binary + no rate-limit/caching; the in-cluster clients
# (Alloy, OTel collector, Grafana, kube-prometheus-stack) will be
# migrated off it in a follow-up so loki.gateway can be disabled
# entirely (see issue #50).
#
# The Tailscale operator is cluster-scoped (ClusterRole grants
# services + services/status across all namespaces) so it picks up
# the tailscale.com/expose annotation regardless of namespace; the
# proxy pod is still created in the operator's own (tailscale) ns.
#
# MinecraftInfra-side promtail clients must target:
#   http://loki-k8s.<tailnet>.ts.net:3100/loki/api/v1/push
---
apiVersion: v1
kind: Service
metadata:
  name: ts-loki-ingress
  namespace: monitoring
  labels:
    app.kubernetes.io/name: ts-loki-ingress
    app.kubernetes.io/part-of: minecraft-monitoring
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "loki-k8s"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/name: loki
    app.kubernetes.io/instance: loki
    app.kubernetes.io/component: single-binary
  ports:
    - name: http
      port: 3100
      targetPort: http-metrics
      protocol: TCP
