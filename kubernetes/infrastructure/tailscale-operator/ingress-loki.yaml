# Tailscale ingress proxy — Loki push gateway
# Exposes Loki's nginx push gateway onto the tailnet so VM-side promtail
# (Proxmox C2E2 + Azure lobby) can ship logs without K8s DNS resolution
# or public port exposure.
#
# Mirrors the ts-alertmanager-ingress pattern: a manually-managed
# EndpointSlice handles the cross-namespace hop into the monitoring
# namespace since Service selectors can't cross namespaces.
#
# MinecraftInfra-side promtail clients must target:
#   http://loki-k8s.<tailnet>.ts.net/loki/api/v1/push
# (currently set to the unresolvable http://mon-loki:3100/loki/api/v1/push
# in both docker/proxmox/docker-compose.yml and docker/azure/docker-compose.yml.)
---
apiVersion: v1
kind: Service
metadata:
  name: ts-loki-ingress
  namespace: tailscale
  labels:
    app.kubernetes.io/name: ts-loki-ingress
    app.kubernetes.io/part-of: minecraft-monitoring
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "loki-k8s"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
---
# Cross-namespace backend: route the tailscale-namespace Service to
# loki-gateway in the monitoring namespace via a manually-managed
# EndpointSlice (Service selectors don't cross namespaces).
# Matches the in-cluster push URL used by Alloy, Grafana, and OTel collector
# (http://loki-gateway.monitoring.svc:80) so the on-cluster and off-cluster
# log paths converge on the same nginx gateway.
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ts-loki-ingress
  namespace: tailscale
  labels:
    kubernetes.io/service-name: ts-loki-ingress
addressType: FQDN
endpoints:
  - addresses:
      - "loki-gateway.monitoring.svc.cluster.local"
    conditions:
      ready: true
ports:
  - name: http
    port: 80
    protocol: TCP
