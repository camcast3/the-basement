# InfisicalSecret — syncs Tailscale OAuth credentials from Infisical → K8s Secret
#
# Creates: Secret "operator-oauth" in namespace "tailscale"
#   Keys:
#     client_id     = <value of TS_OAUTH_CLIENT_ID from Infisical>
#     client_secret = <value of TS_OAUTH_CLIENT_SECRET from Infisical>
#
# The tailscale-operator Helm chart mounts a Secret named "operator-oauth" as a
# volume at /oauth and reads the files "client_id" and "client_secret". The secret
# name and key names below MUST match what the chart expects.
#
# In Infisical, create secrets at:
#   Project: k8s-homelab → Environment: prod → Path: /tailscale
#   Secret names: TS_OAUTH_CLIENT_ID, TS_OAUTH_CLIENT_SECRET

apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: tailscale-oauth
  namespace: tailscale
spec:
  hostAPI: https://infisical.local.negativezone.cc/api

  syncConfig:
    resyncInterval: 5m

  authentication:
    universalAuth:
      secretsScope:
        projectSlug: k8s-homelab-g-j-rt
        envSlug: prod
        secretsPath: /tailscale
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: infisical-operator

  managedKubeSecretReferences:
    - secretName: operator-oauth
      secretNamespace: tailscale
      creationPolicy: Owner
      template:
        includeAllSecrets: false
        data:
          client_id: "{{ .TS_OAUTH_CLIENT_ID.Value }}"
          client_secret: "{{ .TS_OAUTH_CLIENT_SECRET.Value }}"
