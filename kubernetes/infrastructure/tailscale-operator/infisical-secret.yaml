# InfisicalSecret — syncs Tailscale OAuth credentials from Infisical → K8s Secret
#
# Creates: Secret "tailscale-oauth" in namespace "tailscale"
#   Keys:
#     client-id     = <value of TS_OAUTH_CLIENT_ID from Infisical>
#     client-secret = <value of TS_OAUTH_CLIENT_SECRET from Infisical>
#
# In Infisical, create secrets at:
#   Project: k8s-homelab → Environment: prod → Path: /tailscale
#   Secret names: TS_OAUTH_CLIENT_ID, TS_OAUTH_CLIENT_SECRET

apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: tailscale-oauth
  namespace: tailscale
spec:
  hostAPI: https://infisical.local.negativezone.cc/api

  syncConfig:
    resyncInterval: 5m

  authentication:
    universalAuth:
      secretsScope:
        projectSlug: k8s-homelab-g-j-rt
        envSlug: prod
        secretsPath: /tailscale
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: infisical-operator

  managedKubeSecretReferences:
    - secretName: tailscale-oauth
      secretNamespace: tailscale
      creationPolicy: Owner
      template:
        includeAllSecrets: false
        data:
          client-id: "{{ .TS_OAUTH_CLIENT_ID.Value }}"
          client-secret: "{{ .TS_OAUTH_CLIENT_SECRET.Value }}"
