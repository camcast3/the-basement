# Tailscale egress proxy — Craft to Exile 2 (Proxmox VM)
# Bridges in-cluster services to the Proxmox VM's Tailscale IP.
# Prometheus scrapes these ClusterIP services; the operator forwards
# traffic over Tailscale to the actual VM exporters.
#
# Ports exposed:
#   9100  — node-exporter
#   8080  — cadvisor
#   8081  — mc-monitor (itzg/mc-monitor — SLP black-box prober)
#   9080  — promtail (grafana/promtail)
#   19565 — minecraft-prometheus-exporter (cpburnz, in-JVM Forge mod loaded
#           via C2E2's MODS list — exposes TPS, tick histograms, entities,
#           heap/GC. Listens inside the tailscale netns alongside the sidecars.)
#
# Note: C2E2 has no BungeeCord proxy, so 9985 (bungeecord-prometheus-exporter)
# is not exposed here — that exporter is a Velocity plugin and lives on the
# Azure (lobby) side only.
---
apiVersion: v1
kind: Service
metadata:
  name: ts-c2e2-proxy
  namespace: tailscale
  labels:
    app.kubernetes.io/name: ts-c2e2-proxy
    app.kubernetes.io/part-of: minecraft-monitoring
  annotations:
    # Tailscale operator annotation: route traffic to this tailnet FQDN.
    # Must be a fully-qualified MagicDNS name (host.<tailnet>.ts.net), not a
    # bare hostname — the operator rejects bare names with "does not appear to
    # be a valid MagicDNS name". Tailnet device: mc-proxmox.
    tailscale.com/tailnet-fqdn: "mc-proxmox.tail042ec7.ts.net"
    prometheus.io/scrape: "true"
    prometheus.io/port: "9100"
spec:
  type: ExternalName
  externalName: placeholder.tailscale.svc.cluster.local
  ports:
    - name: node-exporter
      port: 9100
      targetPort: 9100
      protocol: TCP
    - name: cadvisor
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: mc-monitor
      port: 8081
      targetPort: 8081
      protocol: TCP
    - name: promtail
      port: 9080
      targetPort: 9080
      protocol: TCP
    - name: minecraft-exporter
      port: 19565
      targetPort: 19565
      protocol: TCP
