# Tailscale egress proxy — Minecraft Lobby (Azure VM)
# Bridges in-cluster services to the Azure VM's Tailscale IP.
# Prometheus scrapes these ClusterIP services; the operator forwards
# traffic over Tailscale to the actual VM exporters.
#
# Ports exposed:
#   9100  — node-exporter
#   8080  — cadvisor
#   8081  — mc-monitor (itzg/mc-monitor)
#   9080  — promtail (grafana/promtail)
#   9985  — bungeecord-prometheus-exporter (Velocity plugin: weihao/bungeecord-prometheus-exporter)
#
# Note: bungeecord-exporter is Azure-only because Velocity (the BungeeCord-protocol
# proxy) runs here. C2E2 / Proxmox has no proxy, so its egress Service omits 9985.
---
apiVersion: v1
kind: Service
metadata:
  name: ts-lobby-proxy
  namespace: tailscale
  labels:
    app.kubernetes.io/name: ts-lobby-proxy
    app.kubernetes.io/part-of: minecraft-monitoring
  annotations:
    # Tailscale operator annotation: route traffic to this tailnet FQDN.
    # Must be a fully-qualified MagicDNS name (host.<tailnet>.ts.net), not a
    # bare hostname — the operator rejects bare names with "does not appear to
    # be a valid MagicDNS name". Tailnet device: proxy-azure (previously
    # vm-minecraft-prod; renamed during Azure rebuild, see issue follow-up).
    tailscale.com/tailnet-fqdn: "proxy-azure.tail042ec7.ts.net"
    prometheus.io/scrape: "true"
    prometheus.io/port: "9100"
spec:
  type: ExternalName
  # The operator replaces this with a ClusterIP once the proxy pod is ready
  externalName: placeholder.tailscale.svc.cluster.local
  ports:
    - name: node-exporter
      port: 9100
      targetPort: 9100
      protocol: TCP
    - name: cadvisor
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: mc-monitor
      port: 8081
      targetPort: 8081
      protocol: TCP
    - name: promtail
      port: 9080
      targetPort: 9080
      protocol: TCP
    - name: bungeecord-exporter
      port: 9985
      targetPort: 9985
      protocol: TCP
