# CSI driver ServiceAccounts + RBAC for the Rook-Ceph external ceph-csi-operator.
#
# WHY THIS EXISTS:
# The cluster runs rook-ceph v1.20.1 with the bundled ceph-csi-operator v1.0.1.
# That operator generates the rbd/cephfs `*-ctrlplugin` Deployments and
# `*-nodeplugin` DaemonSets, which reference ServiceAccounts whose names use the
# operator's CSI_SERVICE_ACCOUNT_PREFIX (empty on this cluster) -> rbd-ctrlplugin-sa,
# rbd-nodeplugin-sa, cephfs-ctrlplugin-sa, cephfs-nodeplugin-sa.
#
# Neither the rook-ceph Helm chart nor the operator creates these per-driver SAs/RBAC
# at runtime, so when they went missing the `*-ctrlplugin` Deployments could not create
# pods ("serviceaccount not found"), the CSI attacher/provisioner went to 0 replicas, and
# RBD/CephFS volumes could no longer attach or detach (e.g. Grafana stuck in Init on a
# FailedAttachVolume for its grafana-data RBD PVC).
#
# These manifests recreate exactly those SAs + Roles/ClusterRoles + bindings (sourced from
# the ceph-csi-operator v1.0.1 deploy bundle, with the empty SA-name prefix this cluster
# uses) so the drivers can run. Keep the names in sync with the operator's
# CSI_SERVICE_ACCOUNT_PREFIX setting.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cephfs-ctrlplugin-sa
  namespace: rook-ceph-external
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cephfs-nodeplugin-sa
  namespace: rook-ceph-external
---
apiVersion: v1
