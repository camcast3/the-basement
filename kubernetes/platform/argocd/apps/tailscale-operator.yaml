apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://pkgs.tailscale.com/helmcharts
      chart: tailscale-operator
      targetRevision: 1.*
      helm:
        valueFiles:
          - $values/kubernetes/infrastructure/tailscale-operator/values.yaml
    - repoURL: https://github.com/camcast3/the-basement.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        # Tailscale proxy pods (sysctler/tailscale containers) run privileged, so the
        # namespace must allow it. Without this the cluster-default PodSecurity level
        # (baseline) rejects the operator-created proxy StatefulSet pods.
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/warn: privileged
        pod-security.kubernetes.io/audit: privileged
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
